name: Application CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube usa o historico para blame e codigo novo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitarios + integracao (Testcontainers) + BDD; falha abaixo de 80% de linhas (merge).
      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco-merged/
          if-no-files-found: ignore

      # Analise de qualidade com quality gate. Configure o secret SONAR_TOKEN e as variables
      # SONAR_PROJECT_KEY, SONAR_ORGANIZATION (SonarCloud) e, para SonarQube proprio, SONAR_HOST_URL.
      - name: SonarQube analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'mechanic-shop-os-service' }}
        run: |
          args=(
            -Dsonar.host.url="$SONAR_HOST_URL"
            -Dsonar.projectKey="$SONAR_PROJECT_KEY"
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco-merged/jacoco.xml
            -Dsonar.qualitygate.wait=true
          )
          if [ -n "$SONAR_ORGANIZATION" ]; then args+=(-Dsonar.organization="$SONAR_ORGANIZATION"); fi
          ./mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar "${args[@]}"

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        run: |
          echo "app_image=${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build -t "${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-backend:${GITHUB_SHA}" .
          docker push "${{ vars.DOCKERHUB_USERNAME }}/mechanic-shop-backend:${GITHUB_SHA}"
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
      - name: Render and apply Kubernetes manifests
        env:
          namespace: mechanic-shop
          app_image: ${{ env.app_image }}
          app_replicas: '1'
          app_cpu_request: 300m
          app_cpu_limit: 1000m
          app_memory_request: 256Mi
          app_memory_limit: 512Mi
          hpa_min_replicas: '1'
          hpa_max_replicas: '10'
          hpa_cpu_average_utilization: '80'
          mailpit_ui_node_port: '30025'
          mailpit_smtp_node_port: '31025'
          cluster_name: ${{ vars.EKS_CLUSTER_NAME }}
          kong_image: kong:3.7
          kong_replicas: '1'
          kong_node_port: '30000'
          kong_cpu_request: 100m
          kong_cpu_limit: 500m
          kong_memory_request: 128Mi
          kong_memory_limit: 512Mi
          app_base_url: ${{ vars.APP_BASE_URL }}
          aws_region: ${{ vars.AWS_REGION }}
          lambda_function_name: ${{ vars.LAMBDA_FUNCTION_NAME }}
          newrelic_app_name: ${{ vars.NEW_RELIC_APP_NAME }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SEED_DEFAULT_PASSWORD: ${{ secrets.SEED_DEFAULT_PASSWORD }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          render() { find "$@" -type f -name '*.yaml' -print0 | xargs -0 -I{} sh -c 'envsubst < "$1" | kubectl apply -f -' sh {}; }
          kubectl apply -f k8s/03-cluster-addons
          render k8s/00-namespaces
          # Secrets antes dos Deployments, para nenhum pod subir sem credenciais.
          kubectl create secret generic rabbitmq-secret --namespace mechanic-shop \
            --from-literal=RABBITMQ_USERNAME="$RABBITMQ_USERNAME" \
            --from-literal=RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic mechanic-shop-app-secret --namespace mechanic-shop \
            --from-literal=SPRING_DATASOURCE_URL="$DATABASE_URL" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$DATABASE_USERNAME" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$DATABASE_PASSWORD" \
            --from-literal=SEED_DEFAULT_PASSWORD="$SEED_DEFAULT_PASSWORD" \
            --from-literal=INTERNAL_API_SECRET="$INTERNAL_API_SECRET" \
            --from-literal=JWT_SECRET="$jwt_secret" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --from-literal=RABBITMQ_USERNAME="$RABBITMQ_USERNAME" \
            --from-literal=RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          # Hashes da configuracao: reiniciam a API e o Kong quando so a configuracao muda
          # (o Kong le o kong.yml apenas no boot).
          export kong_config_checksum=$(envsubst < k8s/01-config/13-kong-config.yaml | sha256sum | cut -c1-16)
          export config_checksum=$( { envsubst < k8s/01-config/10-app-configmap.yaml; kubectl get secret mechanic-shop-app-secret --namespace mechanic-shop -o jsonpath='{.data}'; } | sha256sum | cut -c1-16)
          render k8s/01-config k8s/03-app
          kubectl rollout status deployment/rabbitmq --namespace mechanic-shop --timeout=5m
          kubectl rollout status deployment/mechanic-shop-backend --namespace mechanic-shop --timeout=5m
          kubectl rollout status deployment/kong --namespace mechanic-shop --timeout=5m
