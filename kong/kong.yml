_format_version: "3.0"

# NOTE: the `secret` below must match JWT_SECRET in docker-compose.yaml /
# api.security.token.secret in application.yaml. Kong's declarative config
# does not support env var substitution, so all three must be kept in sync
# manually for local/demo use.

services:
  - name: springapp
    url: http://springapp:8080
    routes:
      # Customer-sensitive routes (see README's role matrix): gated by the
      # jwt plugin here, on top of (not instead of) Spring's own @PreAuthorize.
      - name: service-orders-status
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/service-orders/[0-9a-fA-F-]{36}/status$"
        plugins:
          - name: jwt
      - name: service-orders-detail
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/service-orders/[0-9a-fA-F-]{36}$"
        plugins:
          - name: jwt
      - name: service-orders-search
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "/api/service-orders/search"
        plugins:
          - name: jwt
      - name: vehicles-detail
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/vehicles/[0-9a-fA-F-]{36}$"
        plugins:
          - name: jwt
      - name: vehicles-search
        methods: ["GET"]
        strip_path: false
        regex_priority: 100
        paths:
          - "/api/vehicles/search"
        plugins:
          - name: jwt

      # Everything else (login, swagger,
      # actuator, staff-only endpoints): no gateway-level JWT check, Spring's
      # own SecurityFilter/@PreAuthorize already fully governs these.
      - name: springapp-general
        strip_path: false
        paths:
          - "/api"
          - "/actuator/health"
          - "/v2/api-docs"
          - "/v3/api-docs"
          - "/swagger-resources"
          - "/swagger-ui"
          - "/webjars"

  # Billing Service (orcamento, aprovacao e pagamento). O prefixo /api/billing
  # e mais longo que /api, entao o Kong o prefere ao `springapp-general`.
  # Hostname local: container `billing-service` na mesma rede do Kong.
  - name: billing-service
    url: http://billing-service:8081
    routes:
      # Rotas do cliente dono da OS: JWT exigido no gateway, alem do Spring.
      - name: billing-customer
        methods: ["GET", "POST"]
        strip_path: false
        regex_priority: 100
        paths:
          - "~/api/billing/budgets/[0-9a-fA-F-]{36}(/response)?$"
          - "~/api/billing/payments/[0-9a-fA-F-]{36}(/simulate)?$"
        plugins:
          - name: jwt
      # Link de aprovacao do e-mail (token de uso unico), webhook do Mercado
      # Pago (assinatura) e Swagger: sem JWT no gateway.
      - name: billing-general
        strip_path: false
        paths:
          - "/api/billing"

  # Execution Service (fila, diagnostico e reparo). Rotas so da equipe; o
  # Spring Security do servico aplica JWT e perfil.
  - name: execution-service
    url: http://execution-service:8082
    routes:
      - name: execution-general
        strip_path: false
        paths:
          - "/api/executions"

  - name: cpf-login-function
    # AWS API Gateway (HTTP API) invoke URL for the cpf-login-lambda function,
    # $default stage, route "POST /cpf-login".
    url: https://tpi1pjo0hh.execute-api.us-east-1.amazonaws.com/cpf-login
    routes:
      - name: cpf-login-route
        strip_path: true
        paths:
          - "/functions/cpf-login"

consumers:
  - username: mechanic-shop-users
    jwt_secrets:
      # `key` must equal the `iss` claim every token in this app carries
      # (TokenService.java hardcodes issuer "mechanic-shop-api"; the
      # cpf-login-function mirrors it). One consumer/credential covers all
      # users since the issuer never varies per-user.
      - key: mechanic-shop-api
        algorithm: HS256
        secret: 3f9cd4beba6b4da478ac0d55ffa9bfa056b82f02da0b9527bf2bd7bd02d0cca3
