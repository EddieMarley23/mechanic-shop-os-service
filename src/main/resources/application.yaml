spring:
  application:
    name: pos-tech-challenge-mechanic-shop

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/mechanic-shop-db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A reply that keeps failing is retried in memory and then rejected without requeue,
        # which routes it to the dead-letter queue declared in RabbitTopologyConfig.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    active: ${SMTP_ACTIVE:false}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # Exposes /actuator/health/liveness and /actuator/health/readiness so the Kubernetes
      # probes can check the application instead of just the TCP socket.
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    # E-mail e um efeito colateral assincrono e nao critico: a OS e persistida com
    # sucesso mesmo quando o SMTP esta fora, e a falha ja e reportada pelo evento
    # MechanicShopIntegrationFailure (que tem alerta proprio). Manter o indicador
    # ligado deixaria /actuator/health permanentemente em 503 com SMTP_ACTIVE=false,
    # o que quebraria a metrica de uptime do Synthetics.
    mail:
      enabled: false
    # A broker outage is absorbed by the outbox and should not take the pod out of rotation.
    rabbit:
      enabled: false
  info:
    env:
      enabled: true

springdoc:
  override-with-generic-response: false
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

api:
  security:
    token:
      secret: ${JWT_SECRET:local-dev-jwt-secret-change-me}

internal:
  api:
    secret: ${INTERNAL_API_SECRET:internal-shared-secret-change-me}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: 50
  saga:
    # How long the Saga waits at each step before compensating (ISO-8601 or Spring duration format).
    budget-generation-timeout: ${SAGA_BUDGET_GENERATION_TIMEOUT:5m}
    approval-timeout: ${SAGA_APPROVAL_TIMEOUT:72h}
    payment-timeout: ${SAGA_PAYMENT_TIMEOUT:24h}
    timeout-check-interval-ms: ${SAGA_TIMEOUT_CHECK_INTERVAL_MS:30000}
  seed:
    password: ${SEED_DEFAULT_PASSWORD:''}
    warehouse:
      name: ${SEED_WH_NAME:''}
      email: ${SEED_WH_EMAIL:''}
      document: ${SEED_WH_DOC:''}
      role: ${SEED_WH_ROLE:''}
    receptionist:
      name: ${SEED_RC_NAME:''}
      email: ${SEED_RC_EMAIL:''}
      document: ${SEED_RC_DOC:''}
      role: ${SEED_RC_ROLE:''}
    mechanic:
      name: ${SEED_MC_NAME:''}
      email: ${SEED_MC_EMAIL:''}
      document: ${SEED_MC_DOC:''}
      role: ${SEED_MC_ROLE:''}
    admin:
      name: ${SEED_AD_NAME:''}
      email: ${SEED_AD_EMAIL:''}
      document: ${SEED_AD_DOC:''}
      role: ${SEED_AD_ROLE:''}
    buyer:
      name: ${SEED_BY_NAME:''}
      email: ${SEED_BY_EMAIL:''}
      document: ${SEED_BY_DOC:''}
      role: ${SEED_BY_ROLE:''}