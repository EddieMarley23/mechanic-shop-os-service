# Broker da Saga, compartilhado pelos tres servicos (OS, Billing e Execution).
# Fica neste repositorio porque o OS Service e o orquestrador da Saga.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ${namespace}
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
