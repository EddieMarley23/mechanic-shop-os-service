# Configuracao declarativa do Kong (modo DB-less).
#
# E o mesmo conteudo de kong/kong.yml usado pelo docker-compose, com duas
# diferencas obrigatorias no cluster:
#   - o upstream aponta para o Service `mechanic-shop-backend` em vez do
#     container `springapp`;
#   - o segredo do plugin jwt vem do pipeline (JWT_SECRET), o mesmo valor
#     injetado como JWT_SECRET no Secret da aplicacao. Kong nao expande
#     variaveis de ambiente dentro do arquivo declarativo, entao a unica forma
#     de manter os dois lados em sincronia e templar o arquivo aqui.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: ${namespace}
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: springapp
        url: http://mechanic-shop-backend:8080
        routes:
          # Rotas sensiveis ao cliente (ver matriz de papeis no README):
          # protegidas pelo plugin jwt aqui, somando-se ao @PreAuthorize do
          # Spring em vez de substitui-lo.
          - name: service-orders-status
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/service-orders/[0-9a-fA-F-]{36}/status$"
            plugins:
              - name: jwt
          - name: service-orders-detail
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/service-orders/[0-9a-fA-F-]{36}$"
            plugins:
              - name: jwt
          - name: service-orders-search
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "/api/service-orders/search"
            plugins:
              - name: jwt
          - name: vehicles-detail
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/vehicles/[0-9a-fA-F-]{36}$"
            plugins:
              - name: jwt
          - name: vehicles-search
            methods: ["GET"]
            strip_path: false
            regex_priority: 100
            paths:
              - "/api/vehicles/search"
            plugins:
              - name: jwt

          # Todo o resto (login, swagger e actuator): sem checagem de JWT
          # no gateway, o SecurityFilter/@PreAuthorize do Spring ja governa.
          - name: springapp-general
            strip_path: false
            paths:
              - "/api"
              - "/actuator/health"
              - "/v2/api-docs"
              - "/v3/api-docs"
              - "/swagger-resources"
              - "/swagger-ui"
              - "/webjars"

      # Billing Service (orcamento, aprovacao e pagamento). O prefixo
      # /api/billing e mais longo que /api, entao o Kong o prefere ao
      # `springapp-general`.
      - name: billing-service
        url: http://billing-service:8081
        routes:
          # Rotas do cliente dono da OS: JWT exigido no gateway, alem do Spring.
          - name: billing-customer
            methods: ["GET", "POST"]
            strip_path: false
            regex_priority: 100
            paths:
              - "~/api/billing/budgets/[0-9a-fA-F-]{36}(/response)?$"
              - "~/api/billing/payments/[0-9a-fA-F-]{36}(/simulate)?$"
            plugins:
              - name: jwt
          # Link de aprovacao do e-mail (token de uso unico), webhook do
          # Mercado Pago (assinatura) e Swagger: sem JWT no gateway.
          - name: billing-general
            strip_path: false
            paths:
              - "/api/billing"

      # Execution Service (fila, diagnostico e reparo). Rotas so da equipe;
      # o Spring Security do servico aplica JWT e perfil.
      - name: execution-service
        url: http://execution-service:8082
        routes:
          - name: execution-general
            strip_path: false
            paths:
              - "/api/executions"

    consumers:
      - username: mechanic-shop-users
        jwt_secrets:
          # `key` precisa ser igual a claim `iss` de todo token emitido pela
          # aplicacao (TokenService.java fixa o issuer "mechanic-shop-api").
          # Um unico consumer cobre
          # todos os usuarios porque o issuer nao varia por usuario.
          - key: mechanic-shop-api
            algorithm: HS256
            secret: ${jwt_secret}
